<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b17">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Orbit Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one cockpit column. Reactor dial leads the Today tab, then the slot timeline; bottom nav switches Today / Week / Month / Badges. Single deliberate dark look. */
:root{
  --space:#070b17;
  --panel:rgba(13,21,39,.84);
  --panel-hi:#14203c;
  --line:#2a3d68;
  --line-soft:#1a2849;
  --ink:#e8f1ff;
  --ink-dim:#9fb2d4;
  --ink-faint:#7186ad;
  --reactor:#5fe0ff;
  --reactor-glow:rgba(95,224,255,.42);
  --reactor-dim:#143e50;
  --gold:#f4b73f;
  --gold-dim:#3d3012;
  --alert:#ff6b70;
  --alert-dim:#3d1a22;
  --violet:#8f9bff;
  --f-display:'Chakra Petch','Rajdhani',system-ui,sans-serif;
  --f-body:'Rajdhani',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#070b17;-webkit-text-size-adjust:100%}
body{
  margin:0;
  padding-inline:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(900px 520px at 88% -8%,rgba(95,224,255,.10),transparent 62%),
    radial-gradient(700px 520px at -12% 34%,rgba(143,155,255,.10),transparent 62%),
    var(--space);
  background-attachment:fixed;
  color:var(--ink);
  font:500 17px/1.45 var(--f-body);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;display:grid;gap:16px}
main{display:grid;gap:16px;min-width:0}

/* header */
.head{display:grid;gap:10px}
.head-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font:600 12px var(--f-display);letter-spacing:.28em;text-transform:uppercase;color:var(--reactor)}
.head h1{font:700 28px/1.1 var(--f-display);letter-spacing:.02em;text-wrap:balance}
.mark{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border:1px solid var(--gold-dim);background:rgba(244,183,63,.07);border-radius:2px}
.mark small{font:600 11px var(--f-display);letter-spacing:.2em;color:var(--ink-faint);text-transform:uppercase}
.mark b{font:700 24px var(--f-display);color:var(--gold);line-height:1}
.xp-bar{height:6px;background:var(--line-soft);border-radius:1px;overflow:hidden}
.xp-bar i{display:block;height:100%;background:var(--gold);transition:width .6s}
.xp-txt{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px;font:400 13px var(--f-mono);color:var(--ink-dim)}
.sync{font:400 12px var(--f-mono);color:var(--ink-faint);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
.sync[data-m="cloud"]{color:var(--reactor)}
.sync[data-m="cloud"]::before{background:var(--reactor);box-shadow:0 0 8px var(--reactor-glow)}
.sync[data-m="local"]{color:var(--gold)}
.sync[data-m="local"]::before{background:var(--gold)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:4px;backdrop-filter:blur(3px)}
.panel-pad{padding:16px}
.h2{font:600 13px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim)}
.hint{color:var(--ink-dim);font-size:15px}
.mono{font-family:var(--f-mono)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:center;padding:18px;position:relative}
.hero::before,.hero::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--reactor);pointer-events:none}
.hero::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.hero::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.reactor{width:100%;max-width:220px;height:auto;filter:drop-shadow(0 0 14px var(--reactor-glow))}
.reactor .tk{stroke:var(--line);stroke-width:1.6}
.reactor .tk.on{stroke:var(--reactor)}
.reactor .trk{fill:none;stroke:var(--line-soft);stroke-width:11}
.reactor .arc{fill:none;stroke:var(--reactor);stroke-width:11;transition:stroke-dashoffset .8s ease}
.reactor .inner{fill:none;stroke:var(--line);stroke-width:1}
.reactor .pct{font:700 42px var(--f-display);fill:var(--ink)}
.reactor .pc{font-size:18px;fill:var(--ink-dim)}
.reactor .cap{font:600 10px var(--f-display);letter-spacing:.3em;fill:var(--ink-faint)}
.hero-info{display:grid;gap:12px;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border:1px solid var(--line);font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;border-radius:2px;color:var(--ink-dim)}
.pill[data-p="1"]{color:var(--gold);border-color:var(--gold-dim)}
.pill[data-p="2"]{color:var(--reactor);border-color:var(--reactor-dim)}
.pill[data-p="3"]{color:var(--violet);border-color:#2c3569}
.pill.sun{color:var(--ink);border-color:var(--violet);background:rgba(143,155,255,.14)}
.day-title{font:700 26px/1.1 var(--f-display)}
.nextup{color:var(--ink-dim);font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:8px 10px;border:1px solid var(--line-soft);background:rgba(7,11,23,.5);border-radius:3px;min-width:0}
.stat small{display:flex;align-items:center;gap:5px;font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.stat b{display:block;font:700 22px/1.2 var(--f-display)}
.stat span{font:400 12px var(--f-mono);color:var(--ink-faint)}
.stat svg{width:14px;height:14px}
.stat.fire svg,.stat.fire b{color:var(--gold)}
.stat.bolt svg{color:var(--reactor)}
@media(max-width:560px){
  .hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
  .hero-info{justify-items:center;width:100%}
  .pills{justify-content:center}
  .stats{width:100%;text-align:left}
}

/* banner */
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--violet);background:rgba(143,155,255,.1);border-radius:3px}
.link{color:var(--reactor);font:600 13px var(--f-display);letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}

/* slots */
.slots{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot{display:grid;grid-template-columns:70px minmax(0,1fr) 46px;gap:12px;align-items:start;padding:12px 10px 12px 14px;background:var(--panel);border:1px solid var(--line-soft);border-left:3px solid var(--line);border-radius:3px}
.slot[data-ts="now"]{border-left-color:var(--reactor);border-color:var(--reactor-dim);animation:glow 2.6s ease-in-out infinite}
.slot.done{border-left-color:var(--reactor);background:linear-gradient(90deg,rgba(95,224,255,.08),transparent 65%),var(--panel)}
.slot.missed{border-left-color:var(--alert)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 22px -6px var(--reactor-glow)}}
.time{display:grid;gap:2px;font-family:var(--f-mono);font-size:15px;padding-top:2px}
.time b{font-weight:400;color:var(--ink)}
.time span{color:var(--ink-faint);font-size:13px}
.slot-main{min-width:0;display:grid;gap:4px}
.slot-title{font:600 18px/1.25 var(--f-display);overflow-wrap:anywhere}
.slot.done .slot-title{color:var(--reactor)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:400 12px var(--f-mono);color:var(--ink-faint)}
.tag{padding:1px 7px;border:1px solid var(--line);border-radius:2px;color:var(--ink-dim)}
.tag.xp{color:var(--gold);border-color:var(--gold-dim)}
.tag.miss{color:var(--alert);border-color:var(--alert-dim)}
.note{margin-top:4px;padding:8px 10px;border-left:2px solid var(--reactor-dim);background:rgba(7,11,23,.5);color:var(--ink);font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap}
.done-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:400 12px var(--f-mono);color:var(--ink-faint)}
.chk{width:44px;height:44px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:4px;color:transparent;transition:background .15s,border-color .15s,box-shadow .15s}
.chk:hover:not(:disabled){border-color:var(--reactor);color:var(--reactor-dim)}
.chk[aria-pressed="true"]{background:var(--reactor);border-color:var(--reactor);color:var(--space);box-shadow:0 0 16px -2px var(--reactor-glow)}
.chk:disabled{color:var(--ink-faint);border-style:dashed}
.chk svg{width:22px;height:22px}
.composer{grid-column:1/-1;display:grid;gap:8px;padding-top:6px;border-top:1px dashed var(--line)}
.composer label{font:600 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
textarea{width:100%;resize:vertical;min-height:84px;padding:10px 12px;background:rgba(7,11,23,.75);color:var(--ink);border:1px solid var(--line);border-radius:3px;font:500 17px/1.4 var(--f-body)}
textarea::placeholder{color:var(--ink-faint)}
textarea:focus-visible{outline:2px solid var(--reactor);border-color:var(--reactor)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:2px;font-size:14px;color:var(--ink-dim)}
.chip:hover{border-color:var(--reactor);color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:9px 16px;border:1px solid var(--line);border-radius:3px;font:600 13px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.btn.primary{background:var(--reactor);border-color:var(--reactor);color:var(--space)}
.btn.primary:disabled{background:var(--line-soft);border-color:var(--line-soft);color:var(--ink-faint)}
.journal{display:grid;gap:8px}
.saved{font:400 12px var(--f-mono);color:var(--ink-faint)}

/* week */
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.bar-col{display:grid;gap:6px;justify-items:center;min-width:0;padding:4px 0}
.bar-col:hover .bar i{filter:brightness(1.2)}
.bv{font:400 13px var(--f-mono);color:var(--ink-dim)}
.bar{position:relative;width:100%;height:130px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line);background:linear-gradient(to top,transparent calc(70% - 1px),var(--line) calc(70% - 1px),var(--line) 70%,transparent 70%)}
.bar i{display:block;width:100%;min-height:2px;background:var(--violet);transition:height .5s}
.bar i.hit{background:var(--reactor)}
.bl{display:grid;justify-items:center;font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.bl small{font:400 12px var(--f-mono);color:var(--ink-faint);text-transform:none;letter-spacing:0}
.legend{display:flex;flex-wrap:wrap;gap:14px;font:400 12px var(--f-mono);color:var(--ink-faint)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.grade{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center}
.grade-l{width:72px;height:72px;display:grid;place-items:center;border:2px solid var(--gold);color:var(--gold);font:700 38px var(--f-display);border-radius:3px;background:rgba(244,183,63,.07)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{padding:10px 12px;border:1px solid var(--line-soft);background:rgba(7,11,23,.5);border-radius:3px;min-width:0}
.kv small{display:block;font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.kv b{font:700 22px var(--f-display)}
.kv em{font:400 12px var(--f-mono);font-style:normal;color:var(--ink-faint)}

/* month */
.month-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.month-head h2{font:700 22px var(--f-display)}
.nav-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;color:var(--ink-dim)}
.nav-btn:hover{border-color:var(--reactor);color:var(--reactor)}
.nav-btn svg{width:20px;height:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);text-align:center;padding-bottom:2px}
.cell{--pc:var(--line);min-height:56px;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;padding:5px 2px 4px;border:1px solid var(--line-soft);border-top:3px solid var(--pc);background:var(--panel);border-radius:2px;font-family:var(--f-mono);font-size:15px;min-width:0}
.cell[data-p="1"]{--pc:var(--gold)}
.cell[data-p="2"]{--pc:var(--reactor)}
.cell[data-p="3"]{--pc:var(--violet)}
.cell.empty{border:0;background:none}
.cell.future{color:var(--ink-faint)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.sel{background:var(--panel-hi)}
.cell .sd{width:5px;height:5px;border-radius:50%;background:var(--violet);align-self:center}
.cell .pb{width:80%;height:4px;background:var(--line-soft);align-self:end}
.cell .pb i{display:block;height:100%;background:var(--reactor)}
.leg-p{display:grid;gap:6px}
.leg-p div{display:flex;gap:10px;align-items:center;font-size:16px}
.leg-p i{width:14px;height:4px;flex:none;background:var(--pc)}
.leg-p [data-p="1"]{--pc:var(--gold)}
.leg-p [data-p="2"]{--pc:var(--reactor)}
.leg-p [data-p="3"]{--pc:var(--violet)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.badge{display:grid;gap:6px;padding:14px;border:1px solid var(--line-soft);background:var(--panel);border-radius:3px;color:var(--ink-faint);min-width:0}
.badge svg{width:30px;height:30px}
.badge h3{font:600 17px var(--f-display);color:var(--ink-dim)}
.badge p{font-size:15px}
.badge .prog{height:4px;background:var(--line-soft)}
.badge .prog i{display:block;height:100%;background:var(--ink-faint)}
.badge small{font:400 12px var(--f-mono)}
.badge.on{border-color:var(--gold-dim);background:linear-gradient(160deg,rgba(244,183,63,.10),transparent 60%),var(--panel)}
.badge.on svg{color:var(--gold);filter:drop-shadow(0 0 8px rgba(244,183,63,.5))}
.badge.on h3{color:var(--ink)}
.badge.on .prog i{background:var(--gold)}

/* auth */
.auth{display:grid;gap:12px;padding:20px;max-width:420px;width:100%;margin:20px auto 0}
.auth label{font:600 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.auth input{width:100%;padding:12px;background:rgba(7,11,23,.75);color:var(--ink);border:1px solid var(--line);border-radius:3px;font:500 17px var(--f-body)}
.auth input:focus-visible{outline:2px solid var(--reactor);border-color:var(--reactor)}
.auth-msg{min-height:1.4em;color:var(--alert);font-size:15px}

/* nav + toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(7,11,23,.93);border-top:1px solid var(--line-soft);backdrop-filter:blur(8px)}
.nav-in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.nav button{display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:3px;color:var(--ink-faint);font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;min-height:48px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--reactor);background:rgba(95,224,255,.08)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;width:max-content;max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center;padding:10px 16px;background:var(--panel-hi);border:1px solid var(--gold);border-radius:3px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:16px}
.toast button{color:var(--gold);font:600 13px var(--f-display);letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
@media(prefers-reduced-motion:reduce){
  .slot[data-ts="now"]{animation:none}
  .reactor .arc,.xp-bar i,.bar i{transition:none}
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
  <header id="head" class="head"></header>
  <main id="main"></main>
</div>
<nav class="nav" aria-label="Sections">
  <div class="nav-in" id="nav">
    <button type="button" data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Today</button>
    <button type="button" data-act="tab" data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Week</button>
    <button type="button" data-act="tab" data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Month</button>
    <button type="button" data-act="tab" data-tab="badges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Badges</button>
  </div>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

const phaseOf = d => { const n = d.getDate(); if (n >= 10 && n <= 12) return 1; if (n >= 13 && n <= 24) return 2; return 3; };
const S = (id, title, hint, start, end, kind, extra) => Object.assign({ id, title, hint, start, end, kind }, extra || {});
const minsOf = s => s.credit != null ? s.credit : (s.end - s.start);
const xpOf = s => s.kind === 'focus' ? Math.round(minsOf(s) / 60 * 25) : 10;

function slotsFor(d) {

  if (p === 1 || p === 2) L.push(S('ration_am', 'Ration duty', 'Subah ka shift', 480, 720, 'duty'));
  if (p === 3) {
    L.push(S('free_client', 'Client hunting', 'Free block, man ho to', 480, 720, 'focus', { cat: 'client', credit: 120, bonus: true }));
    L.push(S('free_read', 'Book reading', 'Free block, man ho to', 480, 720, 'focus', { cat: 'reading', credit: 60, bonus: true }));
  }
  L.push(S('client_1', 'Client hunting', 'Leads dhundo, outreach bhejo', 750, 870, 'focus', { cat: 'client' }));
  if (p === 1) {
    L.push(S('ration_pm', 'Ration duty', 'Shaam ka shift', 900, 1080, 'duty'));
    L.push(S('client_2', 'Client hunting', 'Doosra round', 1080, 1260, 'focus', { cat: 'client' }));
  } else {
    L.push(S('lunch', 'Lunch', 'Thoda reset', 870, 900, 'duty'));
    L.push(S('skill', 'Skill upgrade', 'Deep work, phone door', 900, 1260, 'focus', { cat: 'skill' }));
  }
  L.push(S('dinner', 'Dinner', 'Aaram se khao', 1260, 1290, 'duty'));
  L.push(S('read', 'Book reading', 'Din ka last focus block', 1290, 1350, 'focus', { cat: 'reading' }));
  L.push(S('family', 'Family & Aastha', 'Poora dhyan unpe', 1350, 1410, 'duty'));
  L.push(S('sleep', 'Sleep', 'Lights out, kal 6:30 uthna hai', 1410, 1410, 'duty', { point: true }));
  if (sun) {
    L = L.filter(s => s.id !== 'client_2' && s.id !== 'dinner');
    L.forEach(s => {
      if (s.id === 'skill') { s.end = 1080; s.hint = 'Shaam 6 baje tak, phir dost'; }
      if (s.id === 'read') { s.start = 1320; s.hint = 'Dosto ke baad chhota block'; }
    });
    L.push(S('friends', 'Dosto ke saath', 'Sunday shaam, dinner bhi unke saath', 1080, 1320, 'duty'));
  }
  return L.sort((a, b) => a.start - b.start);
}

function calc(key, done) {
  const slots = slotsFor(parseKey(key));
  const req = slots.filter(s => !s.bonus);
  let xp = 0, reqDone = 0, doneCount = 0;
  const focus = { client: 0, skill: 0, reading: 0 };
  slots.forEach(s => {
    if (done[s.id]) {
      xp += xpOf(s); doneCount++;
      if (!s.bonus) reqDone++;
      if (s.kind === 'focus') focus[s.cat] += minsOf(s);
    }
  });
  const pct = req.length ? Math.round(reqDone / req.length * 100) : 0;
  if (pct === 100) xp += 50;
  return { pct, xp, focus, doneCount, total: slots.length, reqTotal: req.length, reqDone };
}

const levelOf = xp => { let L = 1; while (xp >= 100 * (L + 1) * L) L++; return L; };

function loadLocal() { try { const r = localStorage.getItem(CACHE_KEY); return r ? JSON.parse(r) : {}; } catch (e) { return {}; } }
function cacheLocal() { try { localStorage.setItem(CACHE_KEY, JSON.stringify(state.days)); } catch (e) { /* ignore */ } }

function ensureDay(key) {
  let d = state.days[key];
  if (!d) { d = { done: {}, journal: '' }; state.days[key] = d; }
  if (!d.done) d.done = {};
  if (typeof d.journal !== 'string') d.journal = '';
  return d;
}
const dayData = key => state.days[key] ? ensureDay(key) : EMPTY;

let lastErrAt = 0;
function onWriteError() {
  if (Date.now() - lastErrAt > 10000) { lastErrAt = Date.now(); toast('Save nahi hua. Net check karke dobara tick karo.'); }
}

function persist(key) {
  const d = ensureDay(key);
  const st = calc(key, d.done);
  const doc = { date: key, phase: phaseOf(parseKey(key)), done: d.done, journal: d.journal || '', pct: st.pct, xp: st.xp, focus: st.focus, doneCount: st.doneCount, total: st.total };
  state.days[key] = doc;
  cacheLocal();
  if (!cloud) return;
  const payload = clone(doc);
  inflight[key] = (inflight[key] || 0) + 1;
  const prev = chain[key] || Promise.resolve();
  chain[key] = prev.then(() => cloud.set(key, payload)).catch(onWriteError).then(() => { inflight[key]--; });
}

/* ---------- aggregates ---------- */
function agg() {
  const keys = Object.keys(state.days).sort();
  let xp = 0, perfect = 0, active = 0, maxFocus = 0, readDays = 0, wakeDays = 0;
  const focus = { client: 0, skill: 0, reading: 0 };
  const q = new Set();
  keys.forEach(k => {
    const d = state.days[k], f = d.focus || {}, dn = d.done || {};
    xp += d.xp || 0;
    if ((d.pct || 0) >= 100) perfect++;
    if ((d.doneCount || 0) > 0) active++;
    focus.client += f.client || 0; focus.skill += f.skill || 0; focus.reading += f.reading || 0;
    maxFocus = Math.max(maxFocus, (f.client || 0) + (f.skill || 0) + (f.reading || 0));
    if (dn.read || dn.free_read) readDays++;
    if (dn.wake) wakeDays++;
    if ((d.pct || 0) >= STREAK_PCT) q.add(k);
  });
  let best = 0, run = 0, prev = null;
  Array.from(q).sort().forEach(k => { run = (prev && dayDiff(prev, k) === 1) ? run + 1 : 1; best = Math.max(best, run); prev = k; });
  let cur = 0; const c = parseKey(todayKey());
  if (!q.has(keyOf(c))) c.setDate(c.getDate() - 1);
  while (q.has(keyOf(c))) { cur++; c.setDate(c.getDate() - 1); }
  return { xp, perfect, active, maxFocus, readDays, wakeDays, focus, best, cur, level: levelOf(xp) };
}
const unlocked = a => BADGES.filter(b => b.val(a) >= b.goal).map(b => b.id);

/* ---------- commit / announce ---------- */
function commit(key, mut) {
  const before = agg(), ub = unlocked(before);
  mut(ensureDay(key));
  persist(key);
  const after = agg(), ua = unlocked(after);
  const msgs = [];
  if (after.level > before.level) msgs.push('MARK ' + after.level + ' unlock ho gaya');
  BADGES.forEach(b => { if (ua.indexOf(b.id) >= 0 && ub.indexOf(b.id) < 0) msgs.push('Badge: ' + b.name); });
  render();
  if (msgs.length) toast(msgs.join('  ·  '));
}

function toast(msg, act) {
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (act ? '<button type="button" data-act="toast-act">' + esc(act.label) + '</button>' : '');
  toastFn = act ? act.fn : null;
  t.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; toastFn = null; }, act ? 7000 : 4500);
}

function reactorSVG(pct) {
  const C = 2 * Math.PI * 76, off = C * (1 - pct / 100), lit = Math.round(pct / 100 * 60);
  let ticks = '';
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * 2 * Math.PI - Math.PI / 2, r1 = i % 5 === 0 ? 87 : 91, r2 = 96;
    ticks += '<line x1="' + (100 + r1 * Math.cos(a)).toFixed(1) + '" y1="' + (100 + r1 * Math.sin(a)).toFixed(1) + '" x2="' + (100 + r2 * Math.cos(a)).toFixed(1) + '" y2="' + (100 + r2 * Math.sin(a)).toFixed(1) + '" class="' + (i < lit ? 'tk on' : 'tk') + '"/>';
  }
  return '<svg viewBox="0 0 200 200" class="reactor" role="img" aria-label="Daily power ' + pct + ' percent">' +
    '<defs><radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" style="stop-color:var(--ink)"/><stop offset=".5" style="stop-color:var(--reactor);stop-opacity:.5"/><stop offset="1" style="stop-color:var(--reactor);stop-opacity:0"/></radialGradient></defs>' +
    ticks +
    '<circle cx="100" cy="100" r="76" class="trk"/>' +
    '<circle cx="100" cy="100" r="76" class="arc" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 100 100)"/>' +
    '<circle cx="100" cy="100" r="62" class="inner"/>' +
    '<circle cx="100" cy="100" r="58" fill="url(#core)" opacity="' + (0.2 + pct / 160).toFixed(2) + '"/>' +
    '<text x="100" y="106" class="pct" text-anchor="middle">' + pct + '<tspan class="pc">%</tspan></text>' +
    '<text x="100" y="128" class="cap" text-anchor="middle">POWER</text></svg>';
}

function nextText() {
  const key = state.view, tk = todayKey();
  if (key > tk) return 'Ye din abhi aaya nahi. Plan dekh lo.';
  if (key < tk) return 'Purana din. Chhoote slots yahan tick kar sakte ho.';
  const slots = slotsFor(parseKey(key)), done = dayData(key).done, n = new Date(), nm = n.getHours() * 60 + n.getMinutes();
  if (slots.filter(s => !s.bonus).every(s => done[s.id])) return 'Saare slots complete. Armor full power.';
  const cur = slots.filter(s => !s.point && s.start <= nm && nm < s.end);
  const pick = cur.find(s => !s.bonus && !done[s.id]) || cur.find(s => !s.bonus) || cur[0];
  if (pick) return 'Abhi: ' + pick.title + ' · ' + mm(pick.end) + ' tak';
  const nx = slots.find(s => s.start > nm);
  if (nx) return 'Agla: ' + nx.title + ' · ' + mm(nx.start) + ' (' + fmtDur(nx.start - nm) + ' mein)';
  return 'Din ka schedule khatam. Time pe so jao.';
}

function weekHTML() {
  const tk = todayKey(), days = [], prev = [];
  for (let i = 6; i >= 0; i--) { const d = parseKey(tk); d.setDate(d.getDate() - i); days.push(keyOf(d)); }
  for (let i = 13; i >= 7; i--) { const d = parseKey(tk); d.setDate(d.getDate() - i); prev.push(keyOf(d)); }
  const keys = Object.keys(state.days).sort(), first = keys[0] || tk;
  const val = k => (state.days[k] && state.days[k].pct) || 0, xpv = k => (state.days[k] && state.days[k].xp) || 0;
  const counted = days.filter(k => k >= first);
  const avg = counted.length ? Math.round(counted.reduce((s, k) => s + val(k), 0) / counted.length) : 0;
  const xp = days.reduce((s, k) => s + xpv(k), 0), pxp = prev.reduce((s, k) => s + xpv(k), 0);
  const f = { client: 0, skill: 0, reading: 0 }; let perfect = 0, bestK = null;
  days.forEach(k => { const d = state.days[k]; if (!d) return; const ff = d.focus || {}; f.client += ff.client || 0; f.skill += ff.skill || 0; f.reading += ff.reading || 0; if ((d.pct || 0) >= 100) perfect++; if (!bestK || val(k) > val(bestK)) bestK = k; });
  const grade = avg >= 85 ? 'S' : avg >= 70 ? 'A' : avg >= 55 ? 'B' : avg >= 40 ? 'C' : 'D';
  const say = { S: 'Superb hafta. Armor full power pe chala. Yahi rhythm banaye rakho.', A: 'Mast hafta. Thoda aur push karo, Perfect Day bas ek step door hai.', B: 'Theek chala. Client aur skill blocks pe dhyan do, wahi sabse zyada XP dete hain.', C: 'Hafta dheela raha. Kal subah ka pehla slot tick karke momentum banao.', D: 'Reset karo. Poore din ki jagah sirf agle slot pe dhyan do.' }[grade];
  const a = agg();
  const bars = days.map(k => {
    const d = parseKey(k), v = val(k);
    return '<button type="button" class="bar-col" data-act="open-day" data-day="' + k + '" aria-label="' + WD[d.getDay()] + ' ' + d.getDate() + ': ' + v + ' percent"><span class="bv">' + v + '</span><span class="bar"><i class="' + (v >= STREAK_PCT ? 'hit' : '') + '" style="height:' + v + '%"></i></span><span class="bl">' + WD[d.getDay()] + '<small>' + d.getDate() + '</small></span></button>';
  }).join('');
  const bd = bestK ? parseKey(bestK) : null;
  return '<section class="panel panel-pad" style="display:grid;gap:14px"><h2 class="h2">Last 7 days · daily power %</h2><div class="bars">' + bars + '</div>' +
    '<p class="legend"><span><i style="background:var(--reactor)"></i>70%+ streak din</span><span><i style="background:var(--violet)"></i>70% se kam</span><span>Line = 70%</span></p></section>' +
    '<section class="panel panel-pad grade"><div class="grade-l" aria-label="Grade ' + grade + '">' + grade + '</div><div><h2 class="h2">Weekly debrief</h2><p style="font-size:18px">' + esc(say) + '</p></div></section>' +
    '<section class="kv" aria-label="Weekly numbers">' +
    '<div><small>Avg power</small><b>' + avg + '%</b><br><em>' + counted.length + ' din ginte</em></div>' +
    '<div><small>XP</small><b>' + fmt(xp) + '</b><br><em>' + (pxp > 0 ? (xp >= pxp ? '+' : '') + fmt(xp - pxp) + ' vs pichla hafta' : 'pichla hafta data nahi') + '</em></div>' +
    '<div><small>Client hunting</small><b>' + hrs(f.client) + 'h</b></div>' +
    '<div><small>Skill upgrade</small><b>' + hrs(f.skill) + 'h</b></div>' +
    '<div><small>Reading</small><b>' + hrs(f.reading) + 'h</b></div>' +
    '<div><small>Perfect days</small><b>' + perfect + '</b></div>' +
    '<div><small>Streak</small><b>' + a.cur + ' din</b><br><em>best ' + a.best + '</em></div>' +
    '<div><small>Best day</small><b>' + (bd ? WD[bd.getDay()] + ' ' + bd.getDate() : '-') + '</b><br><em>' + (bestK ? val(bestK) + '%' : 'abhi data nahi') + '</em></div></section>';
}

function monthHTML() {
  const y = state.month.y, m = state.month.m, tk = todayKey();
  const first = new Date(y, m, 1), dim = new Date(y, m + 1, 0).getDate(), lead = (first.getDay() + 6) % 7;
  let cells = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(w => '<span class="wd">' + w + '</span>').join('');
  for (let i = 0; i < lead; i++) cells += '<span class="cell empty"></span>';
  let act = 0, sumPct = 0, sumXp = 0;
  for (let d = 1; d <= dim; d++) {
    const dt = new Date(y, m, d), k = keyOf(dt), dd = state.days[k], pct = (dd && dd.pct) || 0;
    if (dd && (dd.doneCount || 0) > 0) { act++; sumPct += pct; sumXp += dd.xp || 0; }
    cells += '<button type="button" class="cell' + (k > tk ? ' future' : '') + (k === tk ? ' today' : '') + (k === state.view ? ' sel' : '') + '" data-p="' + phaseOf(dt) + '" data-act="open-day" data-day="' + k + '" aria-label="' + d + ' ' + MONFULL[m] + ', phase ' + phaseOf(dt) + ', ' + pct + ' percent">' +
      '<span>' + d + '</span>' + (dt.getDay() === 0 ? '<span class="sd" title="Sunday"></span>' : '<span></span>') + '<span class="pb"><i style="width:' + pct + '%"></i></span></button>';
  }
  return '<section class="panel panel-pad" style="display:grid;gap:14px"><div class="month-head"><button type="button" class="nav-btn" data-act="month-prev" aria-label="Pichla mahina">' + I.left + '</button><h2>' + MONFULL[m] + ' ' + y + '</h2><button type="button" class="nav-btn" data-act="month-next" aria-label="Agla mahina">' + I.right + '</button></div>' +
    '<div class="cal">' + cells + '</div><p class="legend"><span><i style="background:var(--violet);border-radius:50%"></i>Sunday</span><span>Neeche ki bar = din ka power %</span></p></section>' +
    '<section class="panel panel-pad leg-p"><h2 class="h2">3 phase ka chakra</h2>' +
    [1, 2, 3].map(p => '<div data-p="' + p + '"><i></i><span><b>' + PHASES[p].name + '</b> · ' + PHASES[p].range + ' · ' + PHASES[p].blurb + '</span></div>').join('') + '</section>' +
    '<section class="kv"><div><small>Active din</small><b>' + act + '</b></div><div><small>Avg power</small><b>' + (act ? Math.round(sumPct / act) : 0) + '%</b></div><div><small>XP is mahine</small><b>' + fmt(sumXp) + '</b></div></section>';
}

function badgesHTML() {
  const a = agg();
  return '<section class="kv"><div><small>Total XP</small><b>' + fmt(a.xp) + '</b></div><div><small>Best streak</small><b>' + a.best + ' din</b></div><div><small>Active din</small><b>' + a.active + '</b></div><div><small>Focus total</small><b>' + hrs(a.focus.client + a.focus.skill + a.focus.reading) + 'h</b></div></section>' +
    '<section class="badges">' + BADGES.map(b => {
      const v = b.val(a), on = v >= b.goal, pct = Math.min(100, Math.round(v / b.goal * 100));
      const shown = b.unit === 'h' ? v.toFixed(1) : Math.floor(v);
      return '<article class="badge' + (on ? ' on' : '') + '">' + I.star + '<h3>' + esc(b.name) + '</h3><p>' + esc(b.desc) + '</p><div class="prog"><i style="width:' + pct + '%"></i></div><small>' + (on ? 'Unlocked' : shown + ' / ' + b.goal + ' ' + b.unit) + '</small></article>';
    }).join('') + '</section>';
}

function applyTimeClasses() {
  const el = $('#slots'); if (!el) return;
  const key = state.view, tk = todayKey(), n = new Date(), nm = n.getHours() * 60 + n.getMinutes();
  el.querySelectorAll('[data-slot]').forEach(li => {
    const st = +li.dataset.start, en = +li.dataset.end, point = li.dataset.point === '1', bonus = li.dataset.bonus === '1';
    let ts;
    if (key > tk) ts = 'future'; else if (key < tk) ts = 'past';
    else ts = point ? (nm >= st ? 'past' : 'future') : (nm >= en ? 'past' : (nm >= st ? 'now' : 'future'));
    li.dataset.ts = ts;
    li.classList.toggle('missed', ts === 'past' && !bonus && !li.classList.contains('done'));
  });
  const nx = $('#nextup'); if (nx) nx.textContent = nextText();
}

function render() {
  const ae = document.activeElement, fid = ae && ae.id, sel = (ae && typeof ae.selectionStart === 'number') ? [ae.selectionStart, ae.selectionEnd] : null;
  $('#head').innerHTML = headHTML();
  const out = state.auth === 'out';
  $('#main').innerHTML = out ? authHTML() : state.tab === 'today' ? todayHTML() : state.tab === 'week' ? weekHTML() : state.tab === 'month' ? monthHTML() : badgesHTML();
  $('.nav').hidden = out;
  document.querySelectorAll('#nav button').forEach(b => { if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  applyTimeClasses();
  if (state.focusNote) {
    state.focusNote = false;
    const ta = $('#note-input'); if (ta) { ta.focus({ preventScroll: false }); ta.setSelectionRange(ta.value.length, ta.value.length); }
  } else if (fid) {
    const el = document.getElementById(fid);
    if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ } } }
  }
}

/* ---------- actions ---------- */
const slotById = id => slotsFor(parseKey(state.view)).find(s => s.id === id);

function onCheck(id) {
  const key = state.view, s = slotById(id); if (!s) return;
  if (key > todayKey()) { toast('Ye din abhi shuru nahi hua.'); return; }
  const cur = dayData(key).done[id];
  if (cur) {
    const prev = clone(cur);
    state.composing = null;
    commit(key, d => { delete d.done[id]; });
    toast(s.title + ' untick kiya', { label: 'Undo', fn: () => commit(key, d => { d.done[id] = prev; }) });
    return;
  }
  if (s.kind === 'duty') { state.composing = null; commit(key, d => { d.done[id] = { at: new Date().toISOString(), note: '' }; }); return; }
  state.composing = { slot: id, text: '', edit: false }; state.focusNote = true; render();
}

function saveNote() {
  const c = state.composing; if (!c) return;
  const s = slotById(c.slot); if (!s) return;
  const text = (c.text || '').trim();
  if (s.kind === 'focus' && text.length < 3) { toast('Thoda likho: is slot mein kya kiya?'); return; }
  const key = state.view; state.composing = null;
  commit(key, d => { const old = d.done[c.slot]; d.done[c.slot] = { at: (old && old.at) || new Date().toISOString(), note: text }; });
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'tab') { state.tab = b.dataset.tab; state.composing = null; render(); window.scrollTo({ top: 0 }); }
  else if (a === 'check') onCheck(b.dataset.slot);
  else if (a === 'edit') { const cur = dayData(state.view).done[b.dataset.slot]; state.composing = { slot: b.dataset.slot, text: (cur && cur.note) || '', edit: true }; state.focusNote = true; render(); }
  else if (a === 'cancel') { state.composing = null; render(); }
  else if (a === 'save-note') saveNote();
  else if (a === 'chip') {
    const c = state.composing, ta = $('#note-input'); if (!c || !ta) return;
    const t = b.dataset.text, base = c.text.trim().replace(/[\s,]+$/, '');
    ta.value = base ? base + ', ' + t : t;
    ta.dispatchEvent(new Event('input', { bubbles: true })); ta.focus();
  }
  else if (a === 'open-day') { state.view = b.dataset.day; const d = parseKey(state.view); state.month = { y: d.getFullYear(), m: d.getMonth() }; state.tab = 'today'; state.composing = null; render(); window.scrollTo({ top: 0 }); }
  else if (a === 'today') { state.view = todayKey(); state.composing = null; render(); }
  else if (a === 'month-prev' || a === 'month-next') { const dlt = a === 'month-prev' ? -1 : 1, d = new Date(state.month.y, state.month.m + dlt, 1); state.month = { y: d.getFullYear(), m: d.getMonth() }; render(); }
  else if (a === 'signin' || a === 'signup') doAuth(a);
  else if (a === 'signout') { if (fb) fb.authM.signOut(fb.auth).catch(() => {}); }
  else if (a === 'toast-act') { const f = toastFn; toastFn = null; $('#toast').hidden = true; if (f) f(); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'note-input' && state.composing) {
    state.composing.text = t.value;
    const s = slotById(state.composing.slot), btn = $('#save-note');
    if (btn && s) btn.disabled = s.kind === 'focus' && t.value.trim().length < 3;
  } else if (t.id === 'journal-input') {
    const key = state.view; ensureDay(key).journal = t.value;
    state.saved = 'Likh rahe ho…'; const sv = $('#saved'); if (sv) sv.textContent = state.saved;
    clearTimeout(jt[key]);
    jt[key] = setTimeout(() => { delete jt[key]; persist(key); state.saved = 'Saved'; const s2 = $('#saved'); if (s2) s2.textContent = state.saved; }, 800);
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'note-input' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveNote(); }
  if (e.target.id === 'auth-pass' && e.key === 'Enter') { e.preventDefault(); doAuth('signin'); }
});

/* ---------- cloud (Firebase) ---------- */
let fb = null, unsubDays = null;
function setMode(m) { state.mode = m; render(); }

const AUTH_MSG = {
  'auth/invalid-credential': 'Email ya password galat hai.',
  'auth/wrong-password': 'Email ya password galat hai.',
  'auth/user-not-found': 'Is email ka account nahi mila. Create account dabao.',
  'auth/invalid-email': 'Email sahi format mein daalo.',
  'auth/email-already-in-use': 'Ye email pehle se registered hai. Sign in karo.',
  'auth/weak-password': 'Password kam se kam 6 character ka rakho.',
  'auth/operation-not-allowed': 'Firebase mein Email/Password sign-in on nahi hai.',
  'auth/admin-restricted-operation': 'Naye account band hain. Apne purane account se sign in karo.',
  'auth/network-request-failed': 'Net nahi mil raha. Connection check karo.',
  'auth/too-many-requests': 'Bahut koshish ho gayi. Thodi der baad try karo.'
};

async function doAuth(kind) {
  if (!fb) return;
  const email = ($('#auth-email') || {}).value || '', pw = ($('#auth-pass') || {}).value || '', msg = $('#auth-msg');
  const b1 = $('#btn-signin'), b2 = $('#btn-signup');
  if (!email.trim() || pw.length < 6) { if (msg) msg.textContent = 'Email aur kam se kam 6 character ka password daalo.'; return; }
  if (msg) msg.textContent = '';
  if (b1) b1.disabled = true; if (b2) b2.disabled = true;
  try {
    if (kind === 'signup') await fb.authM.createUserWithEmailAndPassword(fb.auth, email.trim(), pw);
    else await fb.authM.signInWithEmailAndPassword(fb.auth, email.trim(), pw);
  } catch (e) {
    if (msg) msg.textContent = AUTH_MSG[e && e.code] || ('Login fail ho gaya (' + ((e && e.code) || 'unknown') + ').');
    if (b1) b1.disabled = false; if (b2) b2.disabled = false;
  }
}

async function initCloud() {
  if (!cfgOk()) { state.auth = 'none'; setMode('local'); return; }
  try {
    const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
    const mods = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const appM = mods[0], authM = mods[1], fsM = mods[2];
    const app = appM.initializeApp(FIREBASE_CONFIG);
    const auth = authM.getAuth(app);
    let fdb;
    try { fdb = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
    catch (e) { fdb = fsM.getFirestore(app); }
    fb = { authM, fsM, auth, fdb };
    authM.onAuthStateChanged(auth, user => {
      if (unsubDays) { unsubDays(); unsubDays = null; }
      cloud = null;
      if (!user) {
        state.auth = 'out'; state.days = {}; state.composing = null;
        try { localStorage.removeItem(CACHE_KEY); } catch (e) { /* ignore */ }
        setMode('loading'); return;
      }
      state.auth = 'in';
      cloud = { set: (key, payload) => fsM.setDoc(fsM.doc(fdb, 'users', user.uid, 'days', key), payload) };
      unsubDays = fsM.onSnapshot(fsM.collection(fdb, 'users', user.uid, 'days'), snap => {
        const m = {};
        snap.docs.forEach(x => { m[x.id] = clone(x.data()); });
        Object.keys(state.days).forEach(k => { if (jt[k] || inflight[k]) m[k] = state.days[k]; });
        state.days = m; cacheLocal(); setMode('cloud');
      }, err => { console.warn('firestore', err); setMode('local'); });
      render();
    });
  } catch (err) {
    console.warn('firebase init', err); state.auth = 'none'; setMode('local');
  }
}

/* ---------- starfield ---------- */
const cv = $('#stars'), cx = cv.getContext('2d'), reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, dpr = 1, stars = [];
function sizeStars() {
  dpr = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  stars = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + 0.25, p: Math.random() * 6.28, s: Math.random() * 0.9 + 0.2 }));
  drawStars(0);
}
function drawStars(t) {
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
  stars.forEach(s => {
    cx.globalAlpha = (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t / 1000 * s.s + s.p))) * 0.85;
    cx.fillStyle = s.r > 1 ? '#cfe9ff' : '#9db4d6';
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
  });
}
let lastF = 0;
function loopStars(t) { if (t - lastF > 45 && !document.hidden) { lastF = t; drawStars(t); } requestAnimationFrame(loopStars); }

/* ---------- start ---------- */
state.days = loadLocal();
if (cfgOk()) state.auth = 'wait';
sizeStars();
window.addEventListener('resize', sizeStars);
if (!reduce) requestAnimationFrame(loopStars);
render();
initCloud();
setInterval(applyTimeClasses, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) applyTimeClasses(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
})();
</script>
